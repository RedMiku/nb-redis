spring:
  application:
    name: nbchat-redis
  main:
    web-application-type: none

logging:
  level:
    com.tydic.nbchat.redis: info

nbchat:
  redis-server:
    host: 0.0.0.0
    port: 6379
    boss-threads: 1
    worker-threads: 0
    cleanup-interval-seconds: 5
    connection-log-enabled: true
    command-log-enabled: true
    data-log-enabled: true
    cleanup-log-enabled: true
    max-logged-value-length: 128
